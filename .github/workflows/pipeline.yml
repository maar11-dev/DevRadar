name: DevRadar Pipeline

on:
  schedule:
    # 06:17 y no a la hora en punto: GitHub puede retrasar o descartar los cron
    # programados en el minuto 0, que es cuando más carga tiene.
    - cron: '17 6 * * *'  # todos los días a las 06:17 UTC (ADR-012)
  workflow_dispatch:        # permite lanzarlo manualmente desde la pestaña Actions
    inputs:
      simular_fallo:
        description: 'Fallar a propósito al inicio (sin llamar a Adzuna ni a Groq) para probar el aviso por issue'
        type: boolean
        default: false
      reclasificar_sin_tecnologias:
        description: 'Volver a clasificar con el prompt actual las ofertas sin tecnologías de prompts anteriores (consume cuota de Groq)'
        type: boolean
        default: false
      dias_atras:
        description: 'Antigüedad máxima de las ofertas en días (subir para recuperar días sin ejecución)'
        type: number
        default: 2
      paginas:
        description: 'Páginas de Adzuna a descargar (50 ofertas cada una)'
        type: number
        default: 5

# Permisos mínimos del GITHUB_TOKEN: publicar en la rama `data` y abrir una
# issue si la ejecución falla.
permissions:
  contents: write
  issues: write

# Evita que dos ejecuciones (cron + manual) publiquen a la vez en `data`.
concurrency:
  group: devradar-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      LLM_PROVIDER: groq
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}   # opcional (variable del repo); vacío = modelo por defecto
      DBT_DUCKDB_PATH: ${{ github.workspace }}/data/devradar.duckdb
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt_project

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Simular un fallo (solo si se pide al lanzarlo a mano)
        if: ${{ inputs.simular_fallo }}
        run: |
          echo "::error::Fallo simulado para probar el aviso por issue."
          exit 1

      - name: Crear carpeta de datos
        run: mkdir -p data

      # Cada ejecución parte de la base publicada en la ejecución anterior, para que
      # el histórico se acumule y solo se clasifiquen las ofertas nuevas (ADR-008).
      - name: Restaurar la base de la ejecución anterior (rama data)
        run: |
          if git fetch --depth=1 origin data; then
            git cat-file blob FETCH_HEAD:devradar.duckdb > data/devradar.duckdb
            echo "Base restaurada desde la rama data ($(du -h data/devradar.duckdb | cut -f1))"
          else
            echo "La rama data todavía no existe: se empieza con una base vacía."
          fi

      # La clasificación se hace solo en el paso siguiente, para que el límite de
      # ofertas por ejecución (cuota diaria de Groq, ADR-012) se aplique una vez.
      - name: Ejecutar ingesta de ofertas
        env:
          # En la ejecución programada no hay inputs: se usan los valores por defecto.
          DIAS_ATRAS: ${{ inputs.dias_atras || 2 }}
          PAGINAS: ${{ inputs.paginas || 5 }}
        run: python src/ingest.py --skip-extract --max-days-old "$DIAS_ATRAS" --pages "$PAGINAS"

      - name: Extraer datos estructurados con el LLM
        env:
          RECLASIFICAR: ${{ inputs.reclasificar_sin_tecnologias }}
        run: |
          if [ "$RECLASIFICAR" = "true" ]; then
            python src/extract.py --reclasificar-sin-tecnologias
          else
            python src/extract.py
          fi

      - name: dbt seed (catálogo de tecnologías)
        run: dbt seed
        working-directory: dbt_project

      - name: dbt run
        run: dbt run
        working-directory: dbt_project

      - name: dbt test
        run: dbt test
        working-directory: dbt_project

      - name: Subir base DuckDB resultante como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: devradar-duckdb
          path: data/devradar.duckdb
          retention-days: 7

      # Solo se llega aquí si dbt test ha pasado: nunca se publican datos que no
      # superan los tests. El dashboard desplegado lee de esta rama (ADR-008).
      - name: Publicar la base en la rama data
        run: |
          PUBLICAR_DIR="$RUNNER_TEMP/publicar"
          RAMA_DIR="$RUNNER_TEMP/rama-data"

          # Copia compacta + huella del contenido. No se compara el binario:
          # reconstruir la base con los mismos datos cambia sus bytes.
          python src/publish_db.py data/devradar.duckdb "$PUBLICAR_DIR"

          if git fetch --depth=1 origin data; then
            git worktree add -B data "$RAMA_DIR" FETCH_HEAD
          else
            git worktree add --orphan -b data "$RAMA_DIR"
          fi

          if cmp -s "$PUBLICAR_DIR/devradar.sha256" "$RAMA_DIR/devradar.sha256"; then
            echo "Los datos no han cambiado desde la última publicación: no se hace commit."
            exit 0
          fi

          cp "$PUBLICAR_DIR/devradar.duckdb" "$PUBLICAR_DIR/devradar.sha256" "$RAMA_DIR/"
          cat > "$RAMA_DIR/README.md" <<'EOF'
          # Rama `data`

          Rama generada automáticamente por el workflow **DevRadar Pipeline**; no la edites a mano.

          - `devradar.duckdb`: base con las tablas crudas, el catálogo y los marts de dbt.
          - `devradar.sha256`: huella del contenido, usada para no publicar si nada ha cambiado.

          El dashboard desplegado en Streamlit Community Cloud descarga `devradar.duckdb` de esta rama.
          Ver ADR-008 en `docs/decisions.md` (rama `main`).

          Datos de ofertas: Jobs by Adzuna (https://www.adzuna.es) · The Adzuna API.
          EOF

          cd "$RAMA_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add devradar.duckdb devradar.sha256 README.md
          git commit -m "data: actualiza la base ($(date -u +%F), ejecución #${{ github.run_number }})"
          git push origin data
          echo "Publicada la base en la rama data ($(du -h devradar.duckdb | cut -f1))"

      # Los fallos del cron no se notan si nadie mira Actions: se abre una issue
      # (o se comenta la que ya esté abierta), y GitHub avisa por email.
      - name: Avisar del fallo con una issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITULO: "Fallo del pipeline DevRadar"
          CUERPO: >-
            La ejecución #${{ github.run_number }} (${{ github.event_name }}) ha fallado:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          NUMERO=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITULO\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUMERO" ]; then
            gh issue comment "$NUMERO" --repo "$GITHUB_REPOSITORY" --body "$CUERPO"
          else
            printf '%s\n\n%s\n' "$CUERPO" \
              "Cierra esta issue cuando esté resuelto; los fallos siguientes abrirán una nueva." \
              > "$RUNNER_TEMP/issue.md"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITULO" \
              --body-file "$RUNNER_TEMP/issue.md"
          fi
