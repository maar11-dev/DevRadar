version: 2

models:
  - name: demanda_tecnologias_mensual
    description: >
      Número y porcentaje de ofertas que mencionan cada tecnología, por mes de
      publicación. El porcentaje se calcula solo sobre las ofertas con al menos
      una tecnología detectada (ADR-007).
    columns:
      - name: id_tecnologia_mes
        description: Clave sustituta "tecnologia|YYYY-MM".
        data_tests:
          - not_null
          - unique
      - name: tecnologia
        data_tests:
          - not_null
      - name: mes
        description: Primer día del mes de publicación.
        data_tests:
          - not_null
      - name: num_ofertas
        data_tests:
          - not_null
      - name: total_ofertas_con_tecnologia_mes
        description: >
          Ofertas publicadas ese mes con al menos una tecnología detectada
          (denominador).
        data_tests:
          - not_null
      - name: pct_ofertas
        description: >
          Porcentaje (0-100) de las ofertas del mes con alguna tecnología
          detectada que piden esta tecnología.
        data_tests:
          - not_null

  - name: salarios_por_tecnologia
    description: >
      Salario medio y mediano por tecnología y mes, solo con ofertas que
      publican salario. El salario de cada oferta es el punto medio del rango
      (o el único extremo disponible).
    columns:
      - name: id_tecnologia_mes
        description: Clave sustituta "tecnologia|YYYY-MM".
        data_tests:
          - not_null
          - unique
      - name: tecnologia
        data_tests:
          - not_null
      - name: mes
        data_tests:
          - not_null
      - name: num_ofertas_con_salario
        data_tests:
          - not_null
      - name: salario_medio
      - name: salario_mediano

  - name: tendencia_modalidad
    description: >
      Número y porcentaje de ofertas por modalidad de trabajo y mes, sobre las
      ofertas cuya modalidad se ha podido inferir.
    columns:
      - name: id_modalidad_mes
        description: Clave sustituta "modalidad|YYYY-MM".
        data_tests:
          - not_null
          - unique
      - name: modalidad
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["remoto", "hibrido", "presencial"]
      - name: mes
        data_tests:
          - not_null
      - name: num_ofertas
        data_tests:
          - not_null
      - name: pct_ofertas
        data_tests:
          - not_null

  - name: cobertura_extraccion_mensual
    description: >
      Calidad de la extracción por mes: ofertas clasificadas por el LLM y
      porcentaje de ellas sin ninguna tecnología detectada. Un porcentaje alto
      se debe sobre todo a que Adzuna solo entrega los primeros 500 caracteres
      de la descripción (ADR-007).
    columns:
      - name: mes
        description: Primer día del mes de publicación.
        data_tests:
          - not_null
          - unique
      - name: total_ofertas_clasificadas
        description: Ofertas del mes con una extracción del LLM sin error.
        data_tests:
          - not_null
      - name: ofertas_sin_tecnologia
        description: Ofertas clasificadas sin ninguna tecnología del catálogo.
        data_tests:
          - not_null
      - name: pct_sin_tecnologia
        description: Porcentaje (0-100) de ofertas clasificadas sin tecnologías.
        data_tests:
          - not_null
