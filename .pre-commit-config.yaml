repos:
  # Versiones fijadas igual que en requirements.txt: actualizar ambos a la vez.
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]

# Instalación:
#   pip install pre-commit
#   pre-commit install
#
# Ejecución manual sobre todo el repo:
#   pre-commit run --all-files